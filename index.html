<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Examen Parcial (Progresiones 11–16) - La Energía en los Procesos de la Vida Diaria</title>
  <style>
    /* ==========================================================================
       SISTEMA DE DISEÑO AUTÓNOMO OFFLINE (MOBILE FIRST - ANDROID & IPHONE)
       Sin dependencias externas, sin CDN, alta legibilidad y contraste.
       ========================================================================== */
    :root {
      --bg-app: #f1f5f9;
      --bg-card: #ffffff;
      --bg-cream: #fffef9;
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --border-subtle: #cbd5e1;
      --border-light: #e2e8f0;

      /* Paleta Verde Esmeralda Institucional */
      --emerald-deep: #047857;
      --emerald-main: #059669;
      --emerald-bright: #10b981;
      --emerald-soft: #d1fae5;
      --emerald-tint: #ecfdf5;
      --emerald-border: #6ee7b7;

      /* Estados de apoyo */
      --amber-bg: #fef3c7;
      --amber-border: #f59e0b;
      --amber-text: #92400e;
      --danger-bg: #fee2e2;
      --danger-border: #ef4444;
      --danger-text: #991b1b;

      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 20px rgba(15, 23, 42, 0.10);
      --shadow-lg: 0 14px 32px rgba(4, 120, 87, 0.22);
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background-color 0.25s ease;
    }

    /* ==========================================================================
       FONDO VERDE ESMERALDA INTENSO OBLIGATORIO PARA PANTALLA DE RESULTADOS
       Reconocible inmediatamente en capturas de pantalla ("EL EXAMEN VERDE")
       ========================================================================== */
    body.results-green-mode {
      background-color: #059669;
      background-image: linear-gradient(155deg, #047857 0%, #059669 48%, #10b981 100%);
    }

    #app-content {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Pie de página discreto */
    .app-footer {
      width: 100%;
      text-align: center;
      padding: 12px 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-light);
      background-color: rgba(255, 255, 255, 0.75);
    }

    body.results-green-mode .app-footer {
      background-color: rgba(4, 120, 87, 0.35);
      border-top-color: rgba(255, 255, 255, 0.25);
      color: #ecfdf5;
    }

    /* ==========================================================================
       TARJETAS Y COMPONENTES GENERALES
       ========================================================================== */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-md);
      width: 100%;
    }

    @media (min-width: 600px) {
      #app-content {
        padding: 24px 20px;
      }
      .card {
        padding: 28px;
      }
    }

    .badge-pill {
      display: inline-block;
      background-color: var(--emerald-tint);
      color: var(--emerald-deep);
      border: 1px solid var(--emerald-border);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: var(--radius-full);
    }

    /* Pantalla de Bienvenida */
    .welcome-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .welcome-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 10px;
      line-height: 1.25;
    }

    @media (min-width: 600px) {
      .welcome-title {
        font-size: 1.65rem;
      }
    }

    .welcome-subtitle {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--emerald-deep);
      margin-top: 6px;
    }

    .info-box {
      background-color: #f8fafc;
      border: 1px solid var(--border-light);
      border-left: 4px solid var(--emerald-main);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 0.86rem;
      color: var(--text-secondary);
    }

    .info-box ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .info-box li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .info-dot {
      color: var(--emerald-main);
      font-weight: 900;
    }

    /* Formulario de Identificación */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 13px 14px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-main);
      background-color: #ffffff;
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--emerald-main);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.18);
    }

    /* Botones Táctiles Amplios */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      min-height: 48px;
      transition: transform 0.12s ease, background-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      text-align: center;
      user-select: none;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--emerald-main);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.30);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--emerald-deep);
    }

    .btn-secondary {
      background-color: #ffffff;
      color: var(--text-main);
      border: 2px solid var(--border-subtle);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8fafc;
      border-color: #94a3b8;
    }

    .btn-submit-exam {
      background-color: var(--emerald-deep);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(4, 120, 87, 0.28);
    }

    .btn-submit-exam:hover:not(:disabled) {
      background-color: #065f46;
    }

    /* ==========================================================================
       PANTALLA DE EVALUACIÓN (UNA PREGUNTA POR PANTALLA)
       ========================================================================== */
    .exam-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .exam-topbar {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }

    .student-meta-line {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--emerald-deep);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .question-counter-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .answered-pill {
      background-color: var(--emerald-tint);
      border: 1px solid var(--emerald-border);
      color: var(--emerald-deep);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      white-space: nowrap;
    }

    .question-text {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.55;
    }

    @media (min-width: 600px) {
      .question-text {
        font-size: 1.12rem;
      }
    }

    /* Contenedor de Esquema Visual SVG */
    .svg-figure-box {
      margin: 14px auto 4px auto;
      padding: 10px;
      background-color: #f8fafc;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .svg-figure-box svg {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Opciones de Respuesta */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background-color: #f8fafc;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
      transition: all 0.16s ease;
    }

    .option-btn:hover {
      background-color: #f1f5f9;
      border-color: #94a3b8;
    }

    .option-btn.selected {
      background-color: var(--emerald-tint);
      border-color: var(--emerald-main);
      color: #064e3b;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(5, 150, 105, 0.15);
    }

    .option-radio {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #94a3b8;
      background-color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.85rem;
      font-weight: 900;
      color: #ffffff;
    }

    .option-btn.selected .option-radio {
      border-color: var(--emerald-main);
      background-color: var(--emerald-main);
    }

    /* Barra de Navegación Anterior / Entregar / Siguiente */
    .nav-actions-bar {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }

    @media (max-width: 440px) {
      .nav-actions-bar {
        grid-template-columns: 1fr 1fr;
      }
      .nav-actions-bar .btn-submit-exam {
        grid-column: 1 / -1;
        order: -1;
      }
    }

    /* Navegador Compacto 1..30 */
    .navigator-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
    }

    .navigator-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .navigator-label {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .navigator-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
    }

    @media (max-width: 480px) {
      .nav-grid {
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
      }
    }

    .nav-num-btn {
      height: 36px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--border-subtle);
      background-color: #ffffff;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .nav-num-btn.answered {
      background-color: var(--emerald-soft);
      border-color: var(--emerald-main);
      color: #064e3b;
    }

    .nav-num-btn.current {
      background-color: var(--emerald-deep);
      border-color: #064e3b;
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.45);
      transform: scale(1.05);
      font-weight: 900;
    }

    /* ==========================================================================
       PANTALLA FINAL DE RESULTADOS ("EL EXAMEN VERDE" - COMPACTA PARA CAPTURA)
       ========================================================================== */
    .results-wrapper {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 6px 4px;
    }

    .emerald-evidence-card {
      background-color: var(--bg-cream);
      border: 3px solid #a7f3d0;
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 16px 36px rgba(6, 78, 59, 0.35);
      color: var(--text-main);
    }

    .res-header {
      text-align: center;
      border-bottom: 2px solid var(--emerald-soft);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .res-completed-badge {
      display: inline-block;
      background-color: var(--emerald-main);
      color: #ffffff;
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
    }

    .res-subject-title {
      font-size: 1.02rem;
      font-weight: 900;
      color: #064e3b;
      margin-top: 6px;
      line-height: 1.2;
    }

    .res-prog-subtitle {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--emerald-deep);
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* Datos del Alumno */
    .res-student-box {
      background-color: var(--emerald-tint);
      border: 1px solid var(--emerald-border);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .res-student-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .res-label {
      font-weight: 800;
      color: var(--emerald-deep);
      font-size: 0.74rem;
      text-transform: uppercase;
    }

    .res-val {
      font-weight: 800;
      color: var(--text-main);
      text-align: right;
      word-break: break-word;
    }

    /* Bloque Central de Calificación */
    .res-score-panel {
      background-color: #ffffff;
      border: 2px solid var(--emerald-main);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      text-align: center;
    }

    .res-score-metrics {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 10px;
    }

    .metric-block {
      flex: 1;
    }

    .metric-title {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-number {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--emerald-deep);
      line-height: 1.15;
    }

    .metric-divider {
      width: 2px;
      height: 36px;
      background-color: var(--emerald-soft);
    }

    .performance-tag {
      margin-top: 8px;
      display: inline-block;
      background-color: var(--emerald-soft);
      color: #064e3b;
      border: 1px solid var(--emerald-main);
      font-size: 0.76rem;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      letter-spacing: 0.03em;
    }

    /* Desglose Compacto P11–P16 */
    .prog-breakdown-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 10px;
      background-color: #f8fafc;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }

    .prog-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .prog-item-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .prog-score-num {
      color: var(--emerald-deep);
    }

    .prog-bar-track {
      width: 100%;
      height: 6px;
      background-color: #e2e8f0;
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .prog-bar-fill {
      height: 100%;
      background-color: var(--emerald-main);
      border-radius: var(--radius-full);
    }

    /* Mayor Dominio y Conviene Repasar */
    .res-highlights {
      background-color: var(--emerald-tint);
      border: 1px solid var(--emerald-border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.76rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .highlight-row {
      line-height: 1.35;
      color: var(--text-main);
    }

    .highlight-strong {
      font-weight: 800;
      color: #064e3b;
    }

    /* Fecha y Hora */
    .res-datetime {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-secondary);
      border-top: 1px dashed var(--border-subtle);
      padding-top: 7px;
    }

    /* Aviso Prominente de Captura de Pantalla */
    .screenshot-banner {
      background-color: #fef3c7;
      border: 2.5px solid #f59e0b;
      color: #78350f;
      border-radius: 14px;
      padding: 11px 14px;
      text-align: center;
      font-size: 0.84rem;
      font-weight: 900;
      line-height: 1.35;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }

    /* Botón Revisar Mis Respuestas */
    .btn-review-toggle {
      width: 100%;
      background-color: #ffffff;
      color: #064e3b;
      border: 2px solid #a7f3d0;
      font-weight: 900;
      box-shadow: 0 6px 16px rgba(6, 78, 59, 0.22);
    }

    .btn-review-toggle:hover {
      background-color: #ecfdf5;
    }

    /* Panel de Revisión Detallada */
    .review-section {
      background-color: var(--bg-cream);
      border: 2px solid #a7f3d0;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-md);
    }

    .review-section.hidden {
      display: none;
    }

    .review-heading {
      font-size: 1rem;
      font-weight: 900;
      color: #064e3b;
      border-bottom: 2px solid var(--emerald-soft);
      padding-bottom: 8px;
    }

    .review-card {
      background-color: #ffffff;
      border: 1.5px solid var(--border-light);
      border-left-width: 5px;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.84rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .review-card.is-correct {
      border-left-color: var(--emerald-main);
    }

    .review-card.is-wrong {
      border-left-color: #dc2626;
    }

    .review-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.74rem;
      font-weight: 800;
    }

    .status-ok {
      color: var(--emerald-deep);
    }

    .status-bad {
      color: #b91c1c;
    }

    .prog-chip {
      background-color: #f1f5f9;
      color: var(--text-secondary);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
    }

    .review-q-text {
      font-weight: 700;
      color: var(--text-main);
    }

    .review-detail-box {
      background-color: #f8fafc;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .review-explanation {
      color: #064e3b;
      border-top: 1px solid var(--border-light);
      padding-top: 5px;
      margin-top: 2px;
    }

    /* ==========================================================================
       MODALES PERSONALIZADOS (SIN alert() NI confirm() DEL NAVEGADOR)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.68);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;

    /* ==========================================================================
       ÚNICA FUENTE DE VERDAD (ESTADO GLOBAL DE LA APLICACIÓN)
       ========================================================================== */
    const STORAGE_KEY = "examen_parcial_p11_p16_verde_v1";

    const state = {
      user: { name: "", group: "" },
      started: false,
      currentQuestion: 0,
      questionOrder: [],
      answers: {},
      finished: false,
      results: null
    };

    let reviewExpanded = false;
    let isSubmitting = false;

    /* ==========================================================================
       PERSISTENCIA ROBUSTA OFFLINE CON TRY/CATCH
       ========================================================================== */
    function initDefaultOrder() {
      return QUESTIONS_BANK.map((_, index) => index);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            state.user = parsed.user && typeof parsed.user === "object" ? parsed.user : { name: "", group: "" };
            state.started = Boolean(parsed.started);
            state.currentQuestion = Number.isInteger(parsed.currentQuestion) ? parsed.currentQuestion : 0;
            state.questionOrder = Array.isArray(parsed.questionOrder) && parsed.questionOrder.length === QUESTIONS_BANK.length
              ? parsed.questionOrder
              : initDefaultOrder();
            state.answers = parsed.answers && typeof parsed.answers === "object" ? parsed.answers : {};
            state.finished = Boolean(parsed.finished);
            state.results = parsed.results || null;
            return;
          }
        }
      } catch (err) {
        // Si localStorage está bloqueado o falla, continúa normalmente en memoria
      }
      state.questionOrder = initDefaultOrder();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        // Silencioso para garantizar funcionamiento offline incluso en modo privado
      }
    }

    /* ==========================================================================
       UTILIDADES DE FORMATO Y MODALES PROPIOS (SIN alert() NI confirm())
       ========================================================================== */
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatSpanishList(numbers) {
      if (numbers.length === 0) return "";
      if (numbers.length === 1) return String(numbers[0]);
      const head = numbers.slice(0, -1).join(", ");
      const last = numbers[numbers.length - 1];
      return `${head} y ${last}`;
    }

    function showModal({ type, title, bodyHTML, confirmText, cancelText, onConfirm }) {
      closeActiveModal();
      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.id = "custom-app-modal";

      const iconSymbol = type === "confirm" ? "✓" : "!";
      const iconClass = type === "confirm" ? "confirm" : "warn";

      backdrop.innerHTML = `
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title-text">
          <div class="modal-icon ${iconClass}">${iconSymbol}</div>
          <h3 class="modal-title" id="modal-title-text">${title}</h3>
          <div class="modal-body">${bodyHTML}</div>
          <div class="modal-actions">
            ${cancelText ? `<button type="button" class="btn btn-secondary" id="modal-cancel-btn">${cancelText}</button>` : ""}
            <button type="button" class="btn btn-primary" id="modal-ok-btn">${confirmText || "ENTENDIDO"}</button>
          </div>
        </div>
      `;

      document.body.appendChild(backdrop);

      const okBtn = document.getElementById("modal-ok-btn");
      const cancelBtn = document.getElementById("modal-cancel-btn");

      if (cancelBtn) {
        cancelBtn.addEventListener("click", closeActiveModal);
      }
      if (okBtn) {
        okBtn.addEventListener("click", function () {
          if (typeof onConfirm === "function") {
            onConfirm(okBtn);
          } else {
            closeActiveModal();
          }
        });
      }
    }

    function closeActiveModal() {
      const existing = document.getElementById("custom-app-modal");
      if (existing) existing.remove();
    }

    /* ==========================================================================
       RENDERIZADO PRINCIPAL
       ========================================================================== */
    function renderApp() {
      const container = document.getElementById("app-content");
      if (!container) return;

      // Control estricto del fondo Verde Esmeralda en la pantalla final
      if (state.finished && state.results) {
        document.body.classList.add("results-green-mode");
      } else {
        document.body.classList.remove("results-green-mode");
      }

      if (!state.started) {
        container.innerHTML = renderWelcomeView();
      } else if (!state.finished) {
        container.innerHTML = renderExamView();
      } else {
        container.innerHTML = renderResultsView();
      }
    }

       VISTA 1: PANTALLA INICIAL E IDENTIFICACIÓN OBLIGATORIA
       ========================================================================== */
    function renderWelcomeView() {
      return `
        <section class="card">
          <div class="welcome-header">
            <span class="badge-pill">Educación Media Superior &bull; Evaluación Sumativa</span>

      `;

    function handleStartSubmit(event) {
      event.preventDefault();
      const nameEl = document.getElementById("input-student-name");
      const groupEl = document.getElementById("input-student-group");

      const nameVal = nameEl ? nameEl.value.trim() : "";
      const groupVal = groupEl ? groupEl.value.trim() : "";

      if (!nameVal || !groupVal) {
        showModal({
          type: "warn",
          title: "Datos Obligatorios Incompletos",
          bodyHTML: "Debes escribir tu <strong>Nombre Completo</strong> y tu <strong>Grupo</strong> para poder iniciar el examen.",
          confirmText: "COMPLETAR DATOS"
        });
        return;
      }

      state.user = { name: nameVal, group: groupVal };
      state.started = true;
      state.currentQuestion = 0;
      if (!Array.isArray(state.questionOrder) || state.questionOrder.length !== QUESTIONS_BANK.length) {
        state.questionOrder = initDefaultOrder();
      }
      saveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ==========================================================================
       VISTA 2: EVALUACIÓN (UNA PREGUNTA POR PANTALLA)
       ========================================================================== */
    function renderExamView() {
      const total = state.questionOrder.length;
      const idx = Math.max(0, Math.min(state.currentQuestion, total - 1));
      const bankIdx = state.questionOrder[idx];
      const question = QUESTIONS_BANK[bankIdx];
      const selectedOption = state.answers[question.id];
      const answeredCount = Object.keys(state.answers).length;

      return `
        <div class="exam-stack">
          <!-- Encabezado de Progreso -->
          <header class="exam-topbar">
            <div>
              <div class="student-meta-line">${escapeHTML(state.user.name)} &bull; ${escapeHTML(state.user.group)}</div>
              <div class="question-counter-title">PREGUNTA ${idx + 1} DE ${total}</div>
            </div>
            <div class="answered-pill">
              Contestadas: <strong>${answeredCount}</strong> / ${total}
            </div>
          </header>

          <!-- Tarjeta de Pregunta Actual (Sin pistas ni validación prematura) -->
          <article class="card">
            <p class="question-text">${question.text}</p>
            ${question.svg ? question.svg : ""}

            <div class="options-list" role="radiogroup" aria-label="Opciones de respuesta">
              ${question.options.map((optionText, optIdx) => {
                const isSelected = selectedOption === optIdx;
                return `
                  <button
                    type="button"
                    class="option-btn ${isSelected ? "selected" : ""}"
                    onclick="handleSelectOption(${question.id}, ${optIdx})"
                    aria-pressed="${isSelected}"
                  >
                    <span>${optionText}</span>
                    <span class="option-radio">${isSelected ? "✓" : ""}</span>
                  </button>
                `;
              }).join("")}
            </div>
          </article>

          <!-- Botones Anterior / Entregar / Siguiente -->
          <div class="nav-actions-bar">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="handleStepQuestion(-1)"
              ${idx === 0 ? "disabled" : ""}
            >
              &larr; ANTERIOR
            </button>

            <button
              type="button"
              class="btn btn-submit-exam"
              onclick="handleAttemptFinish()"
            >
              ENTREGAR EXAMEN
            </button>

            <button
              type="button"
              class="btn btn-secondary"
              onclick="handleStepQuestion(1)"
              ${idx === total - 1 ? "disabled" : ""}
            >
              SIGUIENTE &rarr;
            </button>
          </div>

          <!-- Navegador Compacto 1..30 -->
          <nav class="navigator-card" aria-label="Navegador de preguntas">
            <div class="navigator-header">
              <span class="navigator-label">Navegador de preguntas (1–${total})</span>
              <div class="navigator-legend">
                <span class="legend-item"><i class="legend-dot" style="background:#047857;"></i>Actual</span>
                <span class="legend-item"><i class="legend-dot" style="background:#d1fae5;border:1px solid #059669;"></i>Contestada</span>
                <span class="legend-item"><i class="legend-dot" style="background:#ffffff;border:1px solid #cbd5e1;"></i>Pendiente</span>
              </div>
            </div>
            <div class="nav-grid">
              ${state.questionOrder.map((qBankIndex, visualIdx) => {
                const qObj = QUESTIONS_BANK[qBankIndex];
                const isCurrent = visualIdx === idx;
                const isAnswered = state.answers[qObj.id] !== undefined;
                let btnClass = "nav-num-btn";
                if (isCurrent) btnClass += " current";
                else if (isAnswered) btnClass += " answered";

                return `
                  <button
                    type="button"
                    class="${btnClass}"
                    onclick="handleJumpQuestion(${visualIdx})"
                    aria-label="Ir a pregunta ${visualIdx + 1}"
                  >
                    ${visualIdx + 1}
                  </button>
                `;
              }).join("")}
            </div>
          </nav>
        </div>
      `;
    }

    function handleSelectOption(questionId, optionIndex) {
      if (state.finished) return;
      state.answers[questionId] = optionIndex;
      saveState();
      renderApp();
    }

    function handleStepQuestion(delta) {
      const next = state.currentQuestion + delta;
      if (next >= 0 && next < state.questionOrder.length) {
        state.currentQuestion = next;
        saveState();
        renderApp();
      }
    }

    function handleJumpQuestion(targetIndex) {
      if (targetIndex >= 0 && targetIndex < state.questionOrder.length) {
        state.currentQuestion = targetIndex;
        saveState();
        renderApp();
      }
    }

    function handleAttemptFinish() {
      if (state.finished || isSubmitting) return;

      const missingNumbers = [];
      state.questionOrder.forEach((bankIdx, visualIdx) => {
        const q = QUESTIONS_BANK[bankIdx];
        if (state.answers[q.id] === undefined) {
          missingNumbers.push(visualIdx + 1);
        }
      });

      if (missingNumbers.length > 0) {
        const formattedList = formatSpanishList(missingNumbers);
        showModal({
          type: "warn",
          title: "Faltan Preguntas por Contestar",
          bodyHTML: `No puedes entregar el examen todavía.<br><br><strong>Todavía te faltan:<br>${formattedList}.</strong>`,
          confirmText: "CONTINUAR EXAMEN"
        });
        return;
      }

      showModal({
        type: "confirm",
        title: "Confirmar Entrega",
        bodyHTML: "Has contestado las 30 preguntas.<br><strong>¿Deseas entregar definitivamente?</strong>",
        cancelText: "REVISAR",
        confirmText: "ENTREGAR DEFINITIVAMENTE",
        onConfirm: function (btnElement) {
          if (isSubmitting || state.finished) return;
          isSubmitting = true;
          if (btnElement) {
            btnElement.disabled = true;
            btnElement.textContent = "CALIFICANDO...";
          }
          evaluateAndFinishExam();
        }
      });
    }

    /* ==========================================================================
       FUNCIÓN ÚNICA DE VERIFICACIÓN, CALIFICACIÓN Y GENERACIÓN DE RESULTADOS
       Se ejecuta una sola vez al confirmar la entrega definitiva.
       ========================================================================== */
    function evaluateAndFinishExam() {
      // 1. Verificar que existan las 30 respuestas
      const allAnswered = QUESTIONS_BANK.every((q) => state.answers[q.id] !== undefined);
      if (!allAnswered) {
        isSubmitting = false;
        closeActiveModal();
        return;
      }

      // 2. Contar aciertos totales y por progresión (5 reactivos por cada progresión)
      let totalCorrect = 0;
      const progScores = {
        P11: 0,
        P12: 0,
        P13: 0,
        P14: 0,
        P15: 0,
        P16: 0
      };

      QUESTIONS_BANK.forEach((q) => {
        const chosen = state.answers[q.id];
        if (chosen === q.correct) {
          totalCorrect += 1;
          if (Object.prototype.hasOwnProperty.call(progScores, q.prog)) {
            progScores[q.prog] += 1;
          }
        }
      });

      // 3. Calcular porcentaje entero redondeado
      const totalQuestions = QUESTIONS_BANK.length; // 30
      const percentage = Math.round((totalCorrect / totalQuestions) * 100);

      // 4. Determinar nivel de desempeño
      let performanceLabel = "";
      if (percentage >= 90) {
        performanceLabel = "EXCELENTE";
      } else if (percentage >= 80) {
        performanceLabel = "MUY BUEN DESEMPEÑO";
      } else if (percentage >= 70) {
        performanceLabel = "BUEN DESEMPEÑO";
      } else if (percentage >= 60) {
        performanceLabel = "EN PROCESO";
      } else {
        performanceLabel = "REQUIERE REFORZAMIENTO";
      }

      // 5. Identificar fortaleza (Mayor Dominio) y área de repaso (Conviene Repasar), incluyendo empates
      const progKeys = ["P11", "P12", "P13", "P14", "P15", "P16"];
      const values = progKeys.map((k) => progScores[k]);
      const maxVal = Math.max(...values);
      const minVal = Math.min(...values);

      const highestProgs = progKeys.filter((k) => progScores[k] === maxVal);
      const lowestProgs = progKeys.filter((k) => progScores[k] === minVal);

      // 6. Registrar fecha y hora locales
      const now = new Date();
      const dateStr = now.toLocaleDateString("es-MX", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
      const timeStr = now.toLocaleTimeString("es-MX", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      // 7. Guardar resultado definitivo en estado y persistir
      state.finished = true;
      state.results = {
        score: totalCorrect,
        total: totalQuestions,
        percentage: percentage,
        performance: performanceLabel,
        progScores: progScores,
        highestProgs: highestProgs,
        maxProgScore: maxVal,
        lowestProgs: lowestProgs,
        minProgScore: minVal,
        date: dateStr,
        time: timeStr
      };

      saveState();
      closeActiveModal();
      renderApp();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ==========================================================================
       VISTA 3: TARJETA FINAL VERDE ESMERALDA COMPACTA + REVISIÓN DE RESPUESTAS
       ========================================================================== */
    function renderResultsView() {
      const r = state.results;
      const progOrder = ["P11", "P12", "P13", "P14", "P15", "P16"];

      const highestText = `${r.highestProgs.join(", ")} (${r.maxProgScore}/5)`;
      const lowestText = `${r.lowestProgs.join(", ")} (${r.minProgScore}/5)`;

      return `
        <div class="results-wrapper" id="top-results-anchor">
          <!-- TARJETA PRINCIPAL DE EVIDENCIA (COMPACTA PARA UNA PANTALLA VERTICAL) -->
          <section class="emerald-evidence-card" aria-label="Comprobante de resultados del examen">
            <div class="res-header">
              <span class="res-completed-badge">&#9989; EXAMEN COMPLETADO</span>
              <h1 class="res-subject-title">LA ENERGÍA EN LOS PROCESOS DE LA VIDA DIARIA</h1>
              <p class="res-prog-subtitle">PROGRESIONES 11–16</p>
            </div>

            <!-- Identificación del Estudiante -->
            <div class="res-student-box">
              <div class="res-student-row">
                <span class="res-label">NOMBRE:</span>
                <span class="res-val">${escapeHTML(state.user.name)}</span>
              </div>
              <div class="res-student-row">
                <span class="res-label">GRUPO:</span>
                <span class="res-val">${escapeHTML(state.user.group)}</span>
              </div>
            </div>

            <!-- Resultado y Porcentaje -->
            <div class="res-score-panel">
              <div class="res-score-metrics">
                <div class="metric-block">
                  <div class="metric-title">RESULTADO</div>
                  <div class="metric-number">${r.score} / ${r.total}</div>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-block">
                  <div class="metric-title">PORCENTAJE</div>
                  <div class="metric-number">${r.percentage} %</div>
                </div>
              </div>
              <div>
                <span class="performance-tag">DESEMPEÑO: ${r.performance}</span>
              </div>
            </div>

            <!-- Desglose por Progresión (P11 a P16 sobre 5) -->
            <div class="prog-breakdown-grid">
              ${progOrder.map((pKey) => {
                const pts = r.progScores[pKey];
                const barWidth = Math.round((pts / 5) * 100);
                return `
                  <div class="prog-item">
                    <div class="prog-item-top">
                      <span>${pKey}:</span>
                      <span class="prog-score-num">${pts}/5</span>
                    </div>
                    <div class="prog-bar-track">
                      <div class="prog-bar-fill" style="width: ${barWidth}%;"></div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>

            <!-- Mayor Dominio y Conviene Repasar -->
            <div class="res-highlights">
              <div class="highlight-row">
                &#9989; <span class="highlight-strong">MAYOR DOMINIO:</span> ${highestText}
              </div>
              <div class="highlight-row">
                &#128216; <span class="highlight-strong">CONVIENE REPASAR:</span> ${lowestText}
              </div>
            </div>

            <!-- Fecha y Hora -->
            <div class="res-datetime">
              <span>FECHA: <strong>${r.date}</strong></span>
              <span>HORA: <strong>${r.time}</strong></span>
            </div>
          </section>

          <!-- Indicación Prominente de Captura -->
          <div class="screenshot-banner">
            &#128248; TOMA UNA CAPTURA DE ESTA PANTALLA Y ENVÍALA A TU PROFESOR.
          </div>

          <!-- Botón para Desplegar/Ocultar Revisión Detallada -->
          <button
            type="button"
            class="btn btn-review-toggle"
            onclick="handleToggleReview()"
          >
            ${reviewExpanded ? "OCULTAR REVISIÓN DE RESPUESTAS" : "REVISAR MIS RESPUESTAS"}
          </button>

          <!-- Panel de Revisión de los 30 Reactivos -->
          <section id="detailed-review-box" class="review-section ${reviewExpanded ? "" : "hidden"}">
            <h2 class="review-heading">Revisión Detallada de Reactivos (1–30)</h2>

            ${state.questionOrder.map((bankIdx, visualIdx) => {
              const q = QUESTIONS_BANK[bankIdx];
              const chosenIdx = state.answers[q.id];
              const isCorrect = chosenIdx === q.correct;
              const chosenText = chosenIdx !== undefined ? q.options[chosenIdx] : "Sin respuesta";
              const correctText = q.options[q.correct];

              return `
                <article class="review-card ${isCorrect ? "is-correct" : "is-wrong"}">
                  <div class="review-meta">
                    <span class="${isCorrect ? "status-ok" : "status-bad"}">
                      ${isCorrect ? "&#9989; CORRECTA" : "&#10060; INCORRECTA"} &bull; Pregunta ${visualIdx + 1}
                    </span>
                    <span class="prog-chip">${q.progLabel}</span>
                  </div>
                  <p class="review-q-text">${q.text}</p>
                  <div class="review-detail-box">
                    <div><strong>Tu respuesta:</strong> ${chosenText}</div>
                    ${!isCorrect ? `<div><strong>Respuesta correcta:</strong> ${correctText}</div>` : ""}
                    <div class="review-explanation"><strong>Explicación:</strong> ${q.explanation}</div>
                  </div>
                </article>
              `;
            }).join("")}

            <button
              type="button"
              class="btn btn-primary"
              onclick="handleScrollToResults()"
            >
              &uarr; VOLVER A RESULTADOS
            </button>
          </section>
        </div>
      `;
    }

    function handleToggleReview() {
      reviewExpanded = !reviewExpanded;
      renderApp();
      if (reviewExpanded) {
        const revBox = document.getElementById("detailed-review-box");
        if (revBox) {
          revBox.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }
    }

    function handleScrollToResults() {
      const topAnchor = document.getElementById("top-results-anchor");
      if (topAnchor) {
        topAnchor.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    /* ==========================================================================
       ARRANQUE SEGURO DE LA APLICACIÓN
       ========================================================================== */
    window.addEventListener("DOMContentLoaded", function () {
      loadState();
      renderApp();
    });
  </script>
</body>
</html>
